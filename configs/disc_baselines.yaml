# FunduSegmenter is a substitute OD/OC segmenter, not GONet's retrained LUNet.
paths:
  data_root: data
  manifest: data/manifests/gonet_msd.csv
  output_dir: outputs/disc_baselines

segmenter:
  factory: src.models.fundu_segmenter_adapter:make_segmenter
  checkpoint: outputs/FunduSegmenter_OriginalImage.pth
  device: cuda

evaluation:
  gonet_predictions: null
  bootstrap_repetitions: 1000
  bootstrap_fraction: 0.95
  seed: 42

visualization:
  sample_count: 16
  seed: 42
